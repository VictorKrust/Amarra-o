<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado - Mãe Tereza</title>
    <meta name="description" content="Agradecemos pelo seu contato. Mãe Tereza entrará em contato em breve.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/global.css">

    <style>
        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradiente-hero);
            position: relative;
            overflow: hidden;
            padding: var(--espacamento-xl);
        }

        .thank-you-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(212, 168, 83, 0.3) 0%, transparent 100%),
                radial-gradient(2px 2px at 40% 70%, rgba(167, 139, 250, 0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 20%, rgba(255, 255, 255, 0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 60%, rgba(212, 168, 83, 0.2) 0%, transparent 100%),
                radial-gradient(2px 2px at 10% 80%, rgba(167, 139, 250, 0.3) 0%, transparent 100%);
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        .thank-you-card {
            position: relative;
            z-index: 2;
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--borda-grande);
            padding: var(--espacamento-3xl);
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        .thank-you-icon {
            width: 90px;
            height: 90px;
            border-radius: var(--borda-redonda);
            background: var(--gradiente-dourado);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--espacamento-xl);
            box-shadow: var(--sombra-dourada);
            animation: pulse-icon 2s ease-in-out infinite;
        }

        .thank-you-icon i {
            font-size: 2.2rem;
            color: var(--roxo-profundo);
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .thank-you-card h1 {
            color: var(--branco);
            font-size: var(--fonte-3xl);
            margin-bottom: var(--espacamento-lg);
        }

        .thank-you-card p {
            color: rgba(255, 255, 255, 0.8);
            font-size: var(--fonte-lg);
            line-height: 1.8;
            margin-bottom: var(--espacamento-xl);
        }

        .thank-you-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--espacamento-md);
        }

        .thank-you-actions .btn {
            min-width: 180px;
        }

        .btn-whatsapp {
            background: #25D366;
            color: var(--branco);
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.6);
            color: var(--branco);
        }

        @media (max-width: 480px) {
            .thank-you-card {
                padding: var(--espacamento-xl);
            }

            .thank-you-card h1 {
                font-size: var(--fonte-xxl);
            }

            .thank-you-actions {
                flex-direction: column;
            }

            .thank-you-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="thank-you-page">
        <div class="thank-you-card">
            <div class="thank-you-icon">
                <i class="fas fa-heart"></i>
            </div>
            <h1>Mensagem Enviada!</h1>
            <p>Obrigada pelo seu contato. Mãe Tereza recebeu sua mensagem e entrará em contato em breve para agendar sua consulta.</p>
            <div class="thank-you-actions">
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar ao Início
                </a>
                <a href="https://wa.me/5511987654321" class="btn btn-whatsapp" target="_blank">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
            </div>
        </div>
    </main>
</body>
</html>
